services:
  db:
    image: postgres:15-alpine
    container_name: ibfs_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - ibfs_postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [ibfs_network]

  volume-init:
    image: ${BACKEND_IMAGE:-ibfs-backend:local}
    user: "0:0"
    restart: "no"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /app/media /app/staticfiles"]
    volumes:
      - ibfs_media_volume:/app/media
      - ibfs_static_volume:/app/staticfiles

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ibfs-backend:local}
    container_name: ibfs_backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DEBUG: "False"
    ports: ["127.0.0.1:9000:8000"]
    volumes:
      - ibfs_media_volume:/app/media
      - ibfs_static_volume:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 60s
    depends_on:
      db: {condition: service_healthy}
      volume-init: {condition: service_completed_successfully}
    networks: [ibfs_network]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-ibfs-frontend:local}
    container_name: ibfs_frontend
    restart: unless-stopped
    environment:
      DJANGO_ORIGIN: http://backend:8000
      NODE_ENV: production
    ports: ["${FRONTEND_BIND_ADDRESS:-127.0.0.1}:4000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    depends_on:
      backend: {condition: service_healthy}
    networks: [ibfs_network]

networks:
  ibfs_network: {driver: bridge}
volumes:
  ibfs_postgres_data:
  ibfs_media_volume:
  ibfs_static_volume:
