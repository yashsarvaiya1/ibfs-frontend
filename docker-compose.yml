services:
  db:
    image: postgres:15-alpine
    container_name: ibfs_db
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ibfs_postgres_data:/var/lib/postgresql/data/
    networks:
      - ibfs_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE}
    container_name: ibfs_backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
    ports:
      - "9000:8000"
    volumes:
      - ibfs_media_volume:/app/media
      - ibfs_static_volume:/app/staticfiles
    depends_on:
      - db
    networks:
      - ibfs_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    # Removed build args to allow runtime changes
    image: ${FRONTEND_IMAGE}
    container_name: ibfs_frontend
    restart: always
    env_file:
      - .env
    ports:
      - "4000:3000"
    depends_on:
      - backend
    networks:
      - ibfs_network

networks:
  ibfs_network:
    driver: bridge

volumes:
  ibfs_postgres_data:
  ibfs_media_volume:
  ibfs_static_volume:
