services:
  db:
    image: postgres:15-alpine
    container_name: ibfs_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - ibfs_postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [ibfs_network]

  volume-init:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    user: "0:0"
    restart: "no"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /app/media /app/staticfiles"]
    volumes:
      - ibfs_media_volume:/app/media
      - ibfs_static_volume:/app/staticfiles

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    container_name: ibfs_backend
    restart: always
    env_file: [.env]
    environment:
      DB_HOST: db
      DEBUG: "False"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ibfs_media_volume:/app/media
      - ibfs_static_volume:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=10)"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: ${BACKEND_HEALTH_START_PERIOD:-600s}
    depends_on:
      db:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    networks: [ibfs_network]

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    container_name: ibfs_frontend
    restart: always
    environment:
      DJANGO_ORIGIN: http://backend:8000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    networks: [ibfs_network]

networks:
  ibfs_network:
    driver: bridge

volumes:
  ibfs_postgres_data:
  ibfs_media_volume:
  ibfs_static_volume:
